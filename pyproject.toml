[project]
name = "KaTrain"
version = "1.20.0"
description = "Go/Baduk/Weiqi playing and teaching app with a variety of AIs"
authors = [{ name = "Sander Land" }]
# Cap tracks binary-wheel availability of kivy + ffpyplayer (no cp314 wheels yet).
# Kivy 3.14 support is merged to master but unreleased (kivy/kivy#9225); ffpyplayer
# 3.14 is still in progress (matham/ffpyplayer#185). Raise the cap once both ship
# cp314 wheels. Note ffpyplayer is our direct dep (audio); kivy does not pull it.
requires-python = ">=3.11,<3.14"  # pysgf needs 3.11 (typing.Self)
readme = "README.md"
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
]
dependencies = [
    "pygame~=2.0 ; platform_system == 'Darwin'",
    "screeninfo>=0.8.1,<0.9 ; platform_system != 'Darwin'",
    "chardet>=5.2.0,<6",
    "docutils>=0.21.2",
    "ffpyplayer>=4.5.1",
    "urllib3>=2.2.2",
    "kivy>=2.3.1",
    "websocket-client>=1.9.0",
    "certifi>=2026.2.25",
    "pysgf>=1.0.0,<2",
]

[project.urls]
Homepage = "https://github.com/sanderland/katrain"

[project.scripts]
katrain = "katrain.__main__:run_app"

[dependency-groups]
dev = [
    "polib>=1.2.0,<2",
    "pyinstaller>=6.14.1",
    "pytest>=8.3.2",
    "ruff>=0.15.8",
    "tomli>=1.2.0 ; python_version < '3.11'",
]

[tool.uv]
default-groups = [
    "dev",
]

[tool.ruff]
line-length = 120
# Pinned to the minimum supported version so the CI matrix (3.11/3.12/3.13) is consistent.
target-version = "py311"

[tool.ruff.lint]
# Carries over the policy the (previously unenforced) .flake8 described: pyflakes plus
# the pycodestyle error subsets, with E501 left to the formatter. Adds import sorting,
# and RUF100 so a stale or malformed `# noqa` cannot silently blanket-suppress a line.
select = ["E4", "E7", "E9", "F", "I", "RUF100"]
# Kivy's config has to be set before kivy submodules are imported, so module-level
# imports legitimately appear after code in the GUI entry points.
ignore = ["E402"]

[tool.hatch.build.targets.sdist]
include = ["katrain"]

[tool.hatch.build.targets.wheel]
include = ["katrain"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
